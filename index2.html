.note b{font:700 32px Inter;display:block}.note span{font:500 27px Inter;color:#4a3f3f}

.flap:after{content:"";position:absolute;left:0;right:0;top:49px;height:3px;background:#000}
.chk{display:flex;align-items:center;gap:28px;font:700 46px Inter;color:var(--black);margin:26px 0}
.chk i{width:64px;height:64px;border-radius:50%;background:var(--wine);display:flex;align-items:center;justify-content:center;flex:none}

<script>
const $=id=>document.getElementById(id);
const FPS=30, DUR=28;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>cl((t-a)/(b-a));
const E={out:x=>1-Math.pow(1-x,3),expo:x=>x>=1?1:1-Math.pow(2,-10*x),io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,back:x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)},inq:x=>x*x*x};
const L=(a,b,p)=>a+(b-a)*p;
function rnd(s){s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s)}
const GL="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#@$%&*";
function chars(el,txt){el.innerHTML="";const out=[];for(const ch of txt){if(ch==="\n"){el.appendChild(document.createElement("br"));continue}const s=document.createElement("span");s.className="ch";s.textContent=ch;el.appendChild(s);out.push(s)}return out}
function words(el,txt){el.innerHTML="";const out=[];txt.split(/(\n| )/).forEach(w=>{if(w==="\n"){el.appendChild(document.createElement("br"));return}if(w===" "){el.appendChild(document.createTextNode(" "));return}const s=document.createElement("span");s.className="wd";s.textContent=w;el.appendChild(s);out.push(s)});return out}
function scramble(el,txt,p,seed){let o="";const n=txt.length;for(let i=0;i<n;i++){const c=txt[i];if(c===" "||c==="\n"||p*n*1.4-i*.4>i*.0+i*.4){o+=c==="\n"?"<br>":c;continue}o+=GL[Math.floor(rnd(seed+i*7.3)*GL.length)]}el.innerHTML=o}
function typew(el,txt,p,caret=true){if(p<=0){el.textContent="";return}const n=Math.round(txt.length*cl(p));el.textContent=txt.slice(0,n)+(caret&&p<1.15&&Math.floor(p*12)%2===0?"|":"")}
function glitch(el,amt,f){if(amt<=0){el.style.textShadow="none";return}const a=amt*(8+rnd(f)*14);el.style.textShadow=`${a}px 0 rgba(255,40,60,.85),${-a}px 0 rgba(40,220,255,.75)`}
function show(id,on){$(id).style.display=on?"block":"none"}
const imgs={};function frame(img,clip,lt,off=0){const n=108;const k=(Math.floor(lt*FPS)+off)%n+1;img.src=`f/${clip}/${String(k).padStart(3,"0")}.jpg`}

/* ---------- builders ---------- */
const POST=["01","14","11","17","18","02","05","15","20","06","13","09","04","12","07","03"];
(function(){const f=$("feed");for(let c=0;c<3;c++){const col=document.createElement("div");col.className="abs";col.style.cssText=`left:${c*400}px;top:0;width:380px`;for(let r=0;r<9;r++){const im=document.createElement("img");im.src="p"+POST[(c*5+r)%16]+".jpg";im.style.cssText="width:380px;height:675px;object-fit:cover;border-radius:30px;margin-bottom:20px";col.appendChild(im)}f.appendChild(col)}})();
const H1=words($("h1"),"YOU WERE\nABOUT TO"),H2=chars($("h2"),"SCROLL."),H3=chars($("h3"),"DON'T.");
$("h4").innerHTML="";const NM=chars($("nm"),"I'M UMAR.");
const T4=words($("t4"),"TALKING\nHEADS"),T5=chars($("t5"),"3D\nANIMATION"),T6=words($("t6"),"UGC ADS\nTHAT SELL."),T7=words($("t7"),"DESIGN THAT\nSTOPS THUMBS."),T8=$("t8"),LIVE=words($("live"),"PEELIFY\nIS LIVE.");
// NLE timeline
(function(){const n=$("nle");let h=`<div class="abs mono" style="left:24px;top:14px;font-size:22px;color:#a99">00:00:12:08</div>`;const cols=["#7A1622","#3d5a80","#9b6a2f","#5B0F18","#3a6b4f"];let x=24;for(let r=0;r<3;r++){x=24+r*40;for(let i=0;i<7;i++){const w=90+rnd(r*9+i)*130;h+=`<div class="abs" style="left:${x}px;top:${52+r*50}px;width:${w}px;height:40px;border-radius:8px;background:${cols[(i+r)%5]};opacity:.9"></div>`;x+=w+8}}h+=`<div class="abs" id="ph" style="top:40px;bottom:0;width:4px;background:#F8F1E7"></div>`;n.innerHTML=h})();

(function(){const o=$("orb");["p14","p18","p15","p12","p07","p09"].forEach((s,i)=>{const im=document.createElement("img");im.src=s+".jpg";im.className="abs";im.style.cssText="width:220px;height:390px;object-fit:cover;border-radius:24px;left:-110px;top:-195px;opacity:.85";o.appendChild(im)})})();

<div id="hrt" style="width:64px;height:64px">${heart("#F8F1E7")}</div><div style="width:58px;height:58px;border-radius:50%;border:4px solid #F8F1E7"></div><div style="width:58px;height:10px;background:#F8F1E7;border-radius:6px;margin-top:20px"></div></div>
